[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "mef3io"
dynamic = ["version"]
description = "MEF 3.0 read/write — one C++ core with Python bindings (MATLAB via MEX)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mayo Clinic — BNEL" }]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://bnelair.github.io/mef3io/"
Documentation = "https://bnelair.github.io/mef3io/"
Repository = "https://github.com/bnelair/mef3io"
Issues = "https://github.com/bnelair/mef3io/issues"

[project.optional-dependencies]
compat = ["pandas"]
# The legacy `mef-tools` (PyPI; import name `mef_tools`, pulls in pymef) is the
# correctness oracle and benchmark baseline. Installing it makes the suite and
# benchmarks run standalone (no local mef_tools checkout needed).
test = ["pytest", "pandas", "pymef", "mef-tools"]
# Everything the benchmarks compare against: legacy MEF stack + NWB-Zarr.
bench = ["pymef", "mef-tools", "pandas", "pynwb", "hdmf-zarr", "zarr", "numcodecs"]

[tool.scikit-build]
# The importable package lives in python/mef3io; the compiled _mef3io lands
# beside it via the CMake install rule.
wheel.packages = ["python/mef3io"]
minimum-version = "0.9"
build-dir = "build/skbuild/{wheel_tag}"
cmake.version = ">=3.26"
# Single source of truth for the version: the repo-root VERSION file (also
# read by CMake for the C++ core and baked into the extension).
sdist.include = ["VERSION"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+?)\\s*$"

[tool.scikit-build.cmake.define]
MEF3IO_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests", "python/mef3io"]
# The golden fixtures were written by the legacy stack, which leaves several
# section-2 size declarations unset — so opening them warns, correctly, on
# nearly every test. Where the warning IS the thing under test,
# test_p13_validate.py calls warnings.simplefilter("always") inside a
# catch_warnings block, which replaces these filters for the duration
# (catch_warnings itself only saves and restores them).
# Matched by message rather than by category: pytest resolves this at config
# time, before conftest.py puts the in-tree package on sys.path, so naming the
# class here would import the wrong mef3io (or none).
filterwarnings = ["ignore:.*leaves size declarations unset.*"]

[tool.cibuildwheel]
# CPython 3.10+ on the three desktop platforms; skip musl/32-bit for now.
# Architectures come from the runner (native builds — the release workflow
# runs one job per os/arch: linux x86_64 + aarch64, windows AMD64 + ARM64),
# except macOS where one arm64 runner builds both architectures.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# cp314t (free-threaded) excluded until the extension is audited for it.
skip = "*-musllinux* *_i686 *-win32 cp314t-*"
archs = ["auto64"]
build-frontend = "build"
test-requires = ["pytest", "numpy"]
# Run the oracle-free suites against the INSTALLED wheel. This used to be an
# import check, which is how a Windows defect in the durability path shipped:
# FlushFileBuffers needs a GENERIC_WRITE handle, so every flush there failed,
# and nothing on any Windows job had ever executed a write. These five modules
# need no pymef (so they run on every arch, including the ones it has no wheels
# for) and between them cover the codec, headers, tar, robustness, and the
# durability/recovery paths that broke. `tests/conftest.py` only prepends the
# source tree when a locally built extension is present, so here it correctly
# falls through to the wheel under test.
test-command = "python -m pytest {project}/tests/test_p1_headers.py {project}/tests/test_p9_robustness.py {project}/tests/test_p11_tar.py {project}/tests/test_p17_large_files.py {project}/tests/test_p18_recovery.py -q"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
# nanobind needs >=10.13 and the core's std::filesystem >=10.15; the default
# x86_64 target (10.9) fails the build.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

# arm64 macOS starts at 11.0 — state it explicitly rather than relying on the
# toolchain to bump it (wheels tag as macosx_11_0_arm64 either way).
[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
