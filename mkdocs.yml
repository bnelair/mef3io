site_name: mef3io
site_description: Read, write and de-identify MEF 3.0 (Multiscale Electrophysiology Format) EEG, iEEG and ECG recordings from Python, MATLAB and C++ - one C++ core, compatible with meflib, pymef and mef_tools
site_url: https://bnelair.github.io/mef3io/
repo_url: https://github.com/bnelair/mef3io
repo_name: bnelair/mef3io

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list        # enables the { .md-button } link attributes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:   # lets docs pages include repo-root markdown (METADATA.md)
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Getting started:
      - MEF 3.0 for students: students.md
      - Install: install.md
      - Examples: examples.md
  - How-to:
      - Convert EDF, EDF+ or BDF to MEF 3.0: howto/edf_to_mef.md
      - Read MEF 3.0 in Python: howto/read_python.md
      - Read MEF 3.0 in MATLAB: howto/read_matlab.md
      - Long recordings with gaps: howto/long_recordings.md
  - Guides:
      - Python: python.md
      - MATLAB: matlab.md
      - C++ and C ABI: cpp.md
      - Session metadata: metadata.md
      - Validation & repair: validation.md
      - Long recordings: long_recordings.md
      - De-identification & the recording-time offset: anonymization.md
      - Modified copies (channels, passwords, details): transform.md
      - Merging recordings: merge.md
  - API reference:
      - Python: api/python.md
      - MATLAB: api/matlab.md
      - C++ (Doxygen): api/cpp.md
  - Reference:
      - MEF 3.0 on-disk format: mef3_format.md
      - Encryption model: encryption_model.md
      - Performance & legacy comparison: legacy_comparison.md
      - Benchmarks: benchmarks.md
  - Release notes:
      - All releases: release_notes/index.md
      - Unreleased: release_notes/unreleased.md
      - "1.6.0": release_notes/1.6.0.md
      - "1.5.1": release_notes/1.5.1.md
      - "1.5.0": release_notes/1.5.0.md
      - "1.4.0": release_notes/1.4.0.md
      - "1.3.0": release_notes/1.3.0.md
      - "1.2.0": release_notes/1.2.0.md
      - "1.1.4": release_notes/1.1.4.md
      - "1.1.3": release_notes/1.1.3.md
      - "1.1.2": release_notes/1.1.2.md
      - "1.1.1": release_notes/1.1.1.md
      - "1.1.0": release_notes/1.1.0.md
      - "1.0.1": release_notes/1.0.1.md
      - "1.0.0": release_notes/1.0.0.md
      - "0.3.0": release_notes/0.3.0.md
      - "0.2.0": release_notes/0.2.0.md
  - Development:
      - Design & internals: design.md
      - Versioning & releases: releasing.md
  - Contributors and credits: contributors.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bnelair/mef3io
      name: mef3io on GitHub
    - icon: material/application-outline
      link: https://github.com/bnelair/mef3io-studio
      name: mef3io-studio, a desktop app for MEF 3.0 recordings
    - icon: material/server-network
      link: https://github.com/bnelair/mef3io-server
      name: mef3io-server, streams MEF 3.0 data to viewers
