name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  matlab-lint:
    # There is no MATLAB in CI (the .m suites run only in the release job), so
    # a typo in them is otherwise invisible until a release is attempted. This
    # static check catches the two kinds that have actually broken one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks on the MATLAB scripts
        run: python3 scripts/lint_matlab_tests.py

  cpp-tests:
    # All three platforms, not just Linux. The durability barriers are the most
    # platform-specific code in the library — fsync, FlushFileBuffers,
    # F_FULLFSYNC are three different calls with three different rules — and a
    # Windows-only defect in them shipped while this job was Linux-only.
    name: C++ tests ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C++ unit tests
        run: |
          cmake -S core -B build-core -DMEF3IO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core --config Release -j
          ctest --test-dir build-core -C Release --output-on-failure

  python-tests:
    name: pytest ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with the oracle test stack
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Version sanity (single source of truth)
        run: |
          python -c "import mef3io; print('mef3io', mef3io.__version__)"
          python -c "import mef3io, pathlib; v = pathlib.Path('VERSION').read_text().strip(); assert mef3io.__version__ == v, (mef3io.__version__, v)"
      - name: Run test suite
        run: python -m pytest tests -q

  # Newest CPython, oracle-free (the legacy pymef stack may lag new Pythons):
  # compile, import, and a full write/read round trip.
  python-latest-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install and round-trip
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "
          import tempfile
          import numpy as np
          import mef3io
          p = tempfile.mkdtemp() + '/s.mefd'
          w = mef3io.Writer(p, overwrite=True)
          d = np.sin(np.arange(1000) / 9)
          d[100:200] = np.nan
          w.write('ch', d, 1577836800000000, 256.0, precision=3)
          w.close()
          r = mef3io.Reader(p)
          x = r.read('ch')
          assert len(x) == 1000 and np.isnan(x[100:200]).all()
          ok = ~np.isnan(d)
          assert np.allclose(x[ok], np.round(d[ok], 3))
          print('py3.14 round trip OK,', mef3io.__version__)
          "
